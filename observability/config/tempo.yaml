stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 30s   # flush quickly for local dev

compactor:
  compaction:
    block_retention: 744h   # 31 days — covers the 30d TokenOps filter

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
      # Allow backfilled traces up to 15 days old. The control plane skips the
      # Tempo export of any coding-agent turn older than CODING_AGENT_TEMPO_MAX_AGE_SECS
      # (default 15 days, `nasiko_config::CodingAgentIngestConfig`): the two must
      # agree, or old turns are exported only to be dropped here.
      ingestion_time_range_slack: 360h
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false