[package]
name = "nasiko-orchestrator"
version.workspace = true
edition.workspace = true

[dependencies]
# Structural compression of history before selection (IP-4)
nasiko-compress = { workspace = true }
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
dashmap.workspace = true
futures.workspace = true
redis = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx = { workspace = true, features = ["postgres", "uuid", "json"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
nasiko-agent-proxy.workspace = true
nasiko-config.workspace = true
nasiko-flow.workspace = true
nasiko-types.workspace = true
nasiko-hitl.workspace = true
# Derived `token_savings` rows, so /finops/savings and the Optimization page agree
nasiko-savings.workspace = true
# ToSchema on the wire-facing preference enums, so the server's OpenAPI registration (CX-1) for
# `/api/me/context-strategy` and `/api/me/pacms-budget` doesn't need a server-side mirror type.
utoipa = { workspace = true }

[dev-dependencies]
mockito.workspace = true
# Test-only, and deliberately not a real dependency: the MAF tests assert against the ONE
# implementation of the prefix join (`nasiko_react_agent::prefixed`) rather than a local copy of
# it, which would keep passing if that join ever changed. A dev-dependency buys that without
# putting a production edge between these two peer crates.
nasiko-react-agent.workspace = true
tokio = { workspace = true, features = ["test-util"] }
