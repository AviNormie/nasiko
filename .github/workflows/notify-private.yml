name: Notify private repo

# pull_request_target, not pull_request: the latter does not have access to
# secrets when the PR comes from a fork (which is the common case for external
# contributors). pull_request_target runs in the context of the BASE repo, so
# PRIVATE_REPO_PAT is available.
#
# This is safe because the workflow does NOT check out or execute any code from
# the fork — it only reads PR metadata and sends a dispatch.
#
# That metadata (title, branch name) is written by whoever opens the PR, so it
# reaches the script only through env, never through ${{ }} in `run:`. Actions
# pastes ${{ }} into the script text before the shell parses it: a title with a
# `'` would end the quoting and the rest would run as shell, with the PAT in
# scope. jq builds the JSON so any quote in a title is escaped, not fatal.
on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

jobs:
  dispatch-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Trigger PR import in private repo
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          EVENT_TYPE: oss-pr-${{ github.event.action == 'opened' && 'opened' || 'synchronized' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          jq -n \
            --arg event_type "$EVENT_TYPE" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_ref "$HEAD_REF" \
            --arg head_sha "$HEAD_SHA" \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg pr_url "$PR_URL" \
            '{event_type: $event_type,
              client_payload: {pr_number: $pr_number, head_ref: $head_ref,
                head_sha: $head_sha, title: $title, author: $author, pr_url: $pr_url}}' \
          | curl -fsSL -X POST \
              -H "Authorization: token $PRIVATE_REPO_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Nasiko-Labs/nasiko-cloud-rs/dispatches" \
              --data @-
